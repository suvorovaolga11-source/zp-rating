<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Рейтинг Зелёного прорыва</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #F25CC0; --pink-l: #FFB3E6; --pink-d: #C42F96;
  --blue: #1BB2DD; --blue-l: #9BEBFB; --blue-d: #0E93C2;
  --green: #86CC37; --green-l: #BFEA7E; --green-d: #5A9E1C;
  --ink: #14181C; --ink-2: #4A5158; --muted: #8A9097; --line: #E3ECE6;
  --font: Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); font-family: var(--font); }
body { background:
  radial-gradient(45% 28% at 0% 6%, rgba(158,223,59,.22), transparent 70%),
  radial-gradient(42% 28% at 100% 3%, rgba(35,218,241,.22), transparent 70%),
  radial-gradient(40% 25% at 100% 70%, rgba(255,141,220,.12), transparent 70%), #F6FBF7; }
.wrap { max-width: 920px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

/* обложка — как первый слайд «Лестницы партнёра», голубой начинается раньше */
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 28px; padding: 24px 28px 26px; color: #fff;
  background: linear-gradient(110deg, #A6E040 0%, #94DC45 22%, #7FD964 36%, #3FD3C6 50%, #23D2EE 64%, #5FDFF5 82%, #BDF3FB 100%);
  box-shadow: 0 18px 40px rgba(60,190,170,.25); }
.hero::before { content: ""; position: absolute; inset: -20%; z-index: -1; filter: blur(40px);
  background: radial-gradient(35% 45% at 12% 15%, rgba(255,255,255,.55), transparent 70%), radial-gradient(30% 40% at 30% 90%, rgba(190,240,120,.6), transparent 70%); }
.hero .deco { position: absolute; z-index: 0; pointer-events: none; filter: drop-shadow(0 12px 18px rgba(0,60,60,.25)); animation: floaty 7s ease-in-out infinite; }
.hero .arrow { width: 130px; right: 2%; bottom: -16px; }
.hero > :not(.deco) { position: relative; z-index: 1; }
@keyframes floaty { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
.logo { height: 62px; width: auto; padding: 6px 12px; border-radius: 16px; background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
.hero h1 { margin: 18px 0 0; font-size: clamp(30px, 5vw, 50px); font-weight: 800; letter-spacing: -.02em; line-height: 1.04; max-width: 74%; text-shadow: 0 2px 12px rgba(20,110,90,.18); }
.hero p { margin: 8px 0 0; font-size: clamp(14px, 1.8vw, 17px); font-weight: 500; }
.tabs { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.tab { cursor: pointer; font: 700 15px var(--font); padding: 11px 20px; border-radius: 999px; color: #fff;
  background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tab[aria-selected="true"] { background: #fff; color: var(--blue-d); box-shadow: 0 8px 20px rgba(0,60,60,.15); }

.slide { background: #fff; border-radius: 26px; padding: 20px 20px 24px; box-shadow: 0 14px 40px rgba(40,160,150,.08); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { cursor: pointer; font: 600 14px var(--font); padding: 8px 16px; border-radius: 999px; border: 1.5px solid #9FE3F2; background: #fff; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
.head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin: 18px 2px 14px; }
.head h2 { margin: 0; font-size: clamp(24px, 3.6vw, 32px); font-weight: 800; letter-spacing: -.01em; }
.head .meta { color: var(--blue-d); font-size: 15px; font-weight: 600; }

/* список; первая десятка — в лёгкой рамке */
.list, .top10 { display: grid; gap: 10px; }
.top10 { padding: 12px; margin: 0 -6px 12px; border-radius: 22px; border: 1.5px dashed #A9DDEA;
  background: linear-gradient(180deg, rgba(35,210,238,.05), rgba(158,223,59,.05)); }
.row { display: grid; grid-template-columns: 62px 1fr auto; gap: 4px 12px; align-items: center;
  background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px 12px; }
.row.top3 { border-color: #F6C6E8; }
.name { font-weight: 600; font-size: 15px; line-height: 1.25; }
.top3 .name { font-weight: 800; font-size: 16.5px; } .top .name { font-weight: 700; }
.pts { font-weight: 800; font-size: 18px; white-space: nowrap; text-align: right; }
.top3 .pts { font-size: 20px; }
.bar { grid-column: 2 / 4; height: 7px; border-radius: 99px; background: #EDF4F1; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--green-l)); }
.top .bar i { background: linear-gradient(90deg, var(--blue), var(--blue-l)); }
.top3 .bar i { background: linear-gradient(90deg, var(--pink), var(--pink-l)); }

/* медали: 1–3 розовые с короной, 4–10 голубые со звёздочкой; с 11-го — зелёные кружки */
.md { position: relative; isolation: isolate; justify-self: center; width: 44px; height: 44px; display: grid; place-items: center;
  font-weight: 800; font-size: 17px; color: #fff; --l: var(--green-l); --m: var(--green); --d: var(--green-d); }
.md::before { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle at 35% 28%, var(--l), var(--m) 50%, var(--d));
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,0,0,.12), 0 5px 12px rgba(0,0,0,.14); }
.md span { position: relative; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,.28); }
.md.medal { margin-top: -6px; }
.md.pink { --l: var(--pink-l); --m: var(--pink); --d: var(--pink-d); }
.md.blue { --l: var(--blue-l); --m: var(--blue); --d: var(--blue-d); }
.md.plain { width: 40px; height: 40px; font-size: 16px; }
.md .rib { position: absolute; width: 32px; bottom: -19px; left: 50%; translate: -50% 0; z-index: -2; }
.md .crown { position: absolute; width: 26px; top: -15px; left: 50%; translate: -50% 0; z-index: 3; }
.md .star { position: absolute; width: 18px; right: -7px; top: -8px; z-index: 3; }

/* поиск и карточка */
.search { display: flex; gap: 12px; }
.search input { flex: 1; min-width: 0; border: 1.5px solid #9FE3F2; border-radius: 999px; padding: 15px 22px; font: 500 18px var(--font); color: var(--ink); outline: none; background: #fff; }
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(27,178,221,.18); }
.search button { border: 0; border-radius: 999px; padding: 0 30px; background: var(--blue); color: #fff; font: 700 17px var(--font); cursor: pointer; box-shadow: 0 8px 18px rgba(14,147,194,.28); }
.card { position: relative; margin-top: 22px; border-radius: 24px; padding: 22px; background: #fff; border: 1.5px solid var(--line); }
.who { display: flex; gap: 16px; align-items: center; }
.who .md { flex: none; }
.who h2 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 800; }
.who .sub { color: var(--blue-d); font-size: 15px; font-weight: 600; margin-top: 4px; }
.total { position: relative; overflow: hidden; margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 34px; align-items: flex-end; color: #fff; border-radius: 20px; padding: 18px 24px;
  background: linear-gradient(110deg, #94DC45 0%, #7FD964 25%, #3FD3C6 50%, #23D2EE 75%, #5FDFF5 100%); }
.total .lbl { font-size: 14px; font-weight: 600; }
.total .big { font-weight: 800; font-size: 44px; line-height: 1.02; text-shadow: 0 2px 10px rgba(20,110,90,.18); }
.total .rank { font-weight: 800; font-size: 26px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.tile { border: 1.5px solid; border-radius: 18px; padding: 14px 18px; background: #fff; }
.tile .lbl { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.tile .n { display: grid; place-items: center; min-width: 34px; height: 30px; padding: 0 6px; border-radius: 9px; color: #fff; font-weight: 800; font-size: 14px; }
.tile .val { font-weight: 800; font-size: 28px; margin-top: 8px; }
.tile.a { border-color: var(--green); } .tile.a .n { background: var(--green); }
.tile.r { border-color: var(--blue); }  .tile.r .n { background: var(--blue); }
.tile.v { border-color: var(--pink); } .tile.v .n { background: var(--pink); }
.tile.k { border-color: var(--blue-d); } .tile.k .n { background: var(--blue-d); }
.msg { margin-top: 18px; color: var(--ink-2); font-size: 15px; }
.more { display: block; width: 100%; margin-top: 14px; padding: 14px 18px; border-radius: 999px; cursor: pointer;
  font: 700 15px var(--font); color: var(--blue-d); background: #fff; border: 1.5px solid #9FE3F2; }
.more:hover { background: #F0FBFE; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .hero .deco { animation: none; } }
@media (max-width: 600px) {
  .wrap { padding: 12px; gap: 12px; }
  .hero { padding: 18px 18px 22px; border-radius: 22px; }
  .hero h1 { max-width: 100%; margin-top: 16px; }
  .hero .arrow { width: 84px; right: -10px; bottom: -14px; }
  .logo { height: 52px; }
  .tab { flex: 1; text-align: center; padding: 11px 10px; font-size: 14px; }
  .slide { padding: 16px 12px 18px; border-radius: 22px; }
  .top10 { padding: 8px; margin: 0 -4px 10px; }
  .row { grid-template-columns: 54px 1fr auto; padding: 12px 12px 10px; gap: 4px 10px; }
  .name { font-size: 14.5px; } .pts { font-size: 16px; } .top3 .pts { font-size: 18px; }
  .search { flex-direction: column; } .search button { padding: 14px; }
  .tiles { grid-template-columns: 1fr; }
  .card { padding: 18px 16px; }
  .total .big { font-size: 36px; }
}
</style>
</head>

const nf = new Intl.NumberFormat("ru-RU");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

$("updated").textContent = "Данные обновлены " + D.updated;

let city = Math.max(0, D.cities.findIndex(c => c.name === store.get("zp-city")));

function renderChips() {
  $("chips").innerHTML = D.cities.map((c, i) =>
    `<button class="chip" data-i="${i}" aria-pressed="${i === city}">${esc(c.name)}</button>`).join("");
  $("chips").hidden = D.cities.length < 2;
}
function renderList() {
  const c = D.cities[city];
  const max = Math.max(1, ...c.rows.map(r => r[1]));
  $("cityname").textContent = c.name;
  $("meta").textContent = `${c.count} участников`;
  // сразу показываем первые 30, остальных — по кнопке (страница на Тильде не растягивается)
  const shown = showAll ? c.rows.length : Math.min(SHOW_FIRST, c.rows.length);
  const more = c.rows.length - shown;
  $("list").innerHTML = `<div class="top10">${c.rows.slice(0, 10).map(r => row(r, max)).join("")}</div>` +
    (shown > 10 ? `<div class="list">${c.rows.slice(10, shown).map(r => row(r, max)).join("")}</div>` : "") +
    (more > 0 ? `<button class="more" id="more" type="button">Показать остальных участников (ещё ${more})</button>` : "");
  if (more > 0) $("more").onclick = () => { showAll = true; renderList(); };
}
const SHOW_FIRST = 30;
let showAll = false;
const CROWN = `<svg class="crown" viewBox="0 0 32 20" aria-hidden="true"><path d="M2 7l7 5 7-10 7 10 7-5-3 12H5z" fill="#FFC21A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const STAR = `<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.4 7 .8-5.2 4.8 1.4 6.9L12 17.3 5.8 20.7l1.4-6.9L2 9l7-.8z" fill="#FFC21A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const RIB = { pink: ["#E04AAE", "#A8237E"], blue: ["#1BB2DD", "#0A7FA8"] };
// медаль места: 1–3 розовая с короной, 4–10 голубая со звёздочкой, дальше зелёный кружок
function medal(p) {
  if (p > 10) return `<div class="md plain"><span>${p}</span></div>`;
  const col = p <= 3 ? "pink" : "blue", [r1, r2] = RIB[col];
  return `<div class="md medal ${col}"><svg class="rib" viewBox="0 0 40 26" aria-hidden="true"><path d="M8 0h9l-5 26-5-6-6 2z" fill="${r1}"/><path d="M32 0h-9l5 26 5-6 6 2z" fill="${r2}"/></svg>${p <= 3 ? CROWN : STAR}<span>${p}</span></div>`;
}
function row([n, t, p], max) {
  return `<div class="row ${p <= 3 ? "top3" : p <= 10 ? "top" : ""}">${medal(p)}<div class="name">${esc(n)}</div>
    <div class="pts">${nf.format(t)}</div><div class="bar"><i style="width:${(t / max * 100).toFixed(1)}%"></i></div></div>`;
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  city = +b.dataset.i; store.set("zp-city", D.cities[city].name);
  showAll = false;
  renderChips(); renderList();
});

function setView(v) {
  $("tab-rating").setAttribute("aria-selected", v === "rating");
  $("tab-me").setAttribute("aria-selected", v === "me");
  $("view-rating").hidden = v !== "rating";
  $("view-me").hidden = v !== "me";
  history.replaceState(null, "", v === "me" ? "#поиск" : "#рейтинг");
}
$("tab-rating").onclick = () => setView("rating");
$("tab-me").onclick = () => { setView("me"); $("pid").focus(); };

/* SHA-256: Web Crypto, а если недоступен (открыто как файл) — запасной вариант */
function sha256js(str) {
  const K = [], H = [], isP = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return 0; return 1; };
  for (let n = 2, i = 0; i < 64; n++) if (isP(n)) { if (i < 8) H[i] = (Math.pow(n, 1/2) * 2**32) | 0; K[i++] = (Math.pow(n, 1/3) * 2**32) | 0; }
  const b = new TextEncoder().encode(str), l = b.length, w = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  w.set(b); w[l] = 0x80; const dv = new DataView(w.buffer); dv.setUint32(w.length - 4, l * 8);
  const r = (x, n) => (x >>> n) | (x << (32 - n)), W = new Int32Array(64);
  for (let o = 0; o < w.length; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(W[i-15], 7) ^ r(W[i-15], 18) ^ (W[i-15] >>> 3), s1 = r(W[i-2], 17) ^ r(W[i-2], 19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
    }
    let [a, b2, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
    }
    [a, b2, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
async function sha256(str) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  return sha256js(str);
}

const BON = [["a", "Рекрутинг: активация 50 PV"], ["r", "Рекрутинг: регистрация"], ["v", "Вовлечённость"], ["k", "Курс «Я сетевой предприниматель»"]];
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("pid").value.replace(/\D/g, "");
  if (!id) { $("result").innerHTML = `<p class="msg">Введите ID цифрами.</p>`; return; }
  const p = D.ids[(await sha256(D.salt + id)).slice(0, 20)];
  if (!p) { $("result").innerHTML = `<p class="msg">ID ${esc(id)} не найден в списке участников. Проверьте номер.</p>`; return; }
  const c = D.cities[p.c];
  const tiles = p.b ? `<div class="tiles">${BON.map(([k, l], i) =>
    `<div class="tile ${k}"><div class="lbl"><span class="n">0${i + 1}</span>${l}</div><div class="val">${nf.format(p.b[k] || 0)}</div></div>`).join("")}</div>` : "";
  $("result").innerHTML = `
    <div class="card">
      <div class="who">${medal(p.p)}
        <div><h2>${esc(p.n)}</h2><div class="sub">№ ${esc(id)} · ${esc(c.name)}${p.h ? " (" + esc(p.h) + ")" : ""}</div></div></div>
      <div class="total">
        <div><div class="lbl">Всего баллов</div><div class="big">${nf.format(p.t)}</div></div>
        <div><div class="lbl">Место в команде</div><div class="rank">${p.p} из ${c.count}</div></div>
      </div>
      ${tiles}
    </div>`;
});

renderChips(); renderList();
setView(decodeURIComponent(location.hash) === "#поиск" ? "me" : "rating");
